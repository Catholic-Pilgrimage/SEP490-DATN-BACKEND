version: '3.8'

services:
  # Node.js Application
  app:
    build: .
    container_name: pilgrim-app
    ports:
      - "${PORT:-3000}:3000"
    mem_limit: 1536m
    memswap_limit: 1536m
    mem_reservation: 768m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      NODE_OPTIONS: --max-old-space-size=1024
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # Database (Supabase)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DIALECT: ${DB_DIALECT:-postgres}
      DB_SSL: ${DB_SSL:-true}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Resend (Email)
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Swagger
      SWAGGER_USERNAME: ${SWAGGER_USERNAME}
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD}
      # Supabase Storage
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # VBee TTS
      VBEE_API_KEY: ${VBEE_API_KEY}
      VBEE_APP_ID: ${VBEE_APP_ID}
      SERVER_BASE_URL: ${SERVER_BASE_URL}
      VBEE_CALLBACK_URL: ${VBEE_CALLBACK_URL}
      # Firebase
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      # PayOS
      PAYOS_RECEIVE_CLIENT_ID: ${PAYOS_RECEIVE_CLIENT_ID}
      PAYOS_RECEIVE_API_KEY: ${PAYOS_RECEIVE_API_KEY}
      PAYOS_RECEIVE_CHECKSUM_KEY: ${PAYOS_RECEIVE_CHECKSUM_KEY}
      PAYOS_PAYOUT_CLIENT_ID: ${PAYOS_PAYOUT_CLIENT_ID}
      PAYOS_PAYOUT_API_KEY: ${PAYOS_PAYOUT_API_KEY}
      PAYOS_PAYOUT_CHECKSUM_KEY: ${PAYOS_PAYOUT_CHECKSUM_KEY}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL}
      # Google AI
      GOOGLE_AI_KEY_ROUTE: ${GOOGLE_AI_KEY_ROUTE}
      GOOGLE_AI_KEY_ARTICLE: ${GOOGLE_AI_KEY_ARTICLE}
      GOOGLE_AI_KEY_TRANSLATE: ${GOOGLE_AI_KEY_TRANSLATE}
      GOOGLE_AI_KEY_EVENTS: ${GOOGLE_AI_KEY_EVENTS}
      # Vietmap
      VIETMAP_API_KEY: ${VIETMAP_API_KEY}
      VIETMAP_REVERSE_URL: ${VIETMAP_REVERSE_URL}
      VIETMAP_ROUTE_URL: ${VIETMAP_ROUTE_URL}
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: pilgrim-db
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${DB_NAME:-pilgrim_db}
      POSTGRES_USER: ${DB_USER:-pilgrim_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"  # Uncomment if need external access
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pilgrim_user} -d ${DB_NAME:-pilgrim_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
